name: HubSpot Data Cleaning Check

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

jobs:
  check-data-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data cleaning check (dry-run)
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python clean_hubspot_data.py
